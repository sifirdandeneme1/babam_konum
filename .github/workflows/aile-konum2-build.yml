name: Build Aile Konum 2 (Firebase test APK)
on:
  push:
    branches:
      - release/aile-konum2-firebase
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source archive
        run: echo "8ccf9d3939ec9ed0432201ff9f31c1368296aae70c90ed20a789994c66b7232e  aile-konum2-source.zip" | sha256sum -c -
      - name: Unpack Aile Konum 2
        run: unzip -q aile-konum2-source.zip
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android platform 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        working-directory: aile_konum_v2
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: aile-konum2-firebase-test-apk
          path: aile_konum_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
