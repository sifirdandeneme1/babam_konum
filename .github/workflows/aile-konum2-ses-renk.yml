name: Build Aile Konum 2.1 (Ses ve Renk)
on:
  push:
    branches:
      - feature/aile-konum2-ses-renk
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify original v2 source
        run: echo '8ccf9d3939ec9ed0432201ff9f31c1368296aae70c90ed20a789994c66b7232e  aile-konum2-source.zip' | sha256sum -c -
      - name: Unpack original app and new sound controls
        run: |
          unzip -q aile-konum2-source.zip
          base64 -d patches/aile-konum2-ses-v21.zip.b64 > /tmp/aile-konum2-ses-v21.zip
          echo '343d57ced451523bafb04b85ce6ba55f90e2774f449bb0d23e99bdfb563d1725  /tmp/aile-konum2-ses-v21.zip' | sha256sum -c -
          unzip -oq /tmp/aile-konum2-ses-v21.zip
          python3 patches/konum-renk.py
      - name: Verify new source and version
        run: |
          grep -q 'class SoundControl' aile_konum_v2/app/src/main/java/com/omer/ailekonum2/SoundControl.java
          grep -q 'freshnessText.setTextColor(fresh?' aile_konum_v2/app/src/main/java/com/omer/ailekonum2/MainActivity.java
          grep -q 'versionName.*2.1.0' aile_konum_v2/app/build.gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug and unsigned release
        working-directory: aile_konum_v2
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Upload test APK (debug signature; NOT compatible with signed v2.0)
        uses: actions/upload-artifact@v4
        with:
          name: AileKonum2-1-TEST-debug
          path: aile_konum_v2/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Prepare offline signing toolkit
        run: |
          mkdir -p release-toolkit
          cp aile_konum_v2/app/build/outputs/apk/release/app-release-unsigned.apk release-toolkit/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-toolkit/
      - name: Upload unsigned release for signing with original PRIVATE key (never upload key)
        uses: actions/upload-artifact@v4
        with:
          name: AileKonum2-1-unsigned-release-toolkit
          path: release-toolkit/*
          retention-days: 14
          if-no-files-found: error
