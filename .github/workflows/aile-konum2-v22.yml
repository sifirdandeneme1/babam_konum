name: Aile Konum 2.2 - Profesyonel arayuz
on:
  push:
    branches: [feature/aile-konum2-v22-profesyonel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify original clean v2 source
        run: echo '8ccf9d3939ec9ed0432201ff9f31c1368296aae70c90ed20a789994c66b7232e  aile-konum2-source.zip' | sha256sum -c -
      - name: Unpack original plus v2.2 changes
        run: |
          unzip -q aile-konum2-source.zip
          base64 -d patches/aile-konum2-v22-overlay.b64 > /tmp/aile-konum2-v22-overlay.zip
          echo '20f984b49344b53e3351b4d8d0aa0b2eed271a7438ea139adc8a32f3f4eea0bb  /tmp/aile-konum2-v22-overlay.zip' | sha256sum -c -
          unzip -oq /tmp/aile-konum2-v22-overlay.zip
      - name: Verify version and features
        run: |
          grep -q 'versionCode 4' aile_konum_v2/app/build.gradle
          grep -q "versionName '2.2.0'" aile_konum_v2/app/build.gradle
          grep -q 'ACCESS_NOTIFICATION_POLICY' aile_konum_v2/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' aile_konum_v2/app/src/main/AndroidManifest.xml
          grep -q 'STOP_RING' aile_konum_v2/app/src/main/java/com/omer/ailekonum2/LocationService.java
          grep -q 'private void openFullscreen()' aile_konum_v2/app/src/main/java/com/omer/ailekonum2/MainActivity.java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug and release
        working-directory: aile_konum_v2
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Upload debug APK (test only - debug signature)
        uses: actions/upload-artifact@v4
        with:
          name: AileKonum2-v2.2-debug-TEST
          path: aile_konum_v2/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Prepare signing toolkit (unsigned APK, no private key)
        run: |
          mkdir -p release-toolkit
          cp aile_konum_v2/app/build/outputs/apk/release/app-release-unsigned.apk release-toolkit/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-toolkit/
      - name: Upload unsigned release toolkit
        uses: actions/upload-artifact@v4
        with:
          name: AileKonum2-v2.2-unsigned-release-toolkit
          path: release-toolkit/*
          retention-days: 14
          if-no-files-found: error
