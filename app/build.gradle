plugins {
    id "com.android.application"
}

android {
    namespace "com.omer.ailekonum"
    compileSdk 35

    defaultConfig {
        applicationId "com.omer.ailekonum"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "3.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
